<!DOCTYPE html>
<!-- The chrome of this page — language, title, meta tags and the hero — is
     tokenised rather than translated in place: the same head serves manual.html
     (English) and manual_ru.html (Russian), and tools/build-manual.js fills each
     token with the string of the page being written. A second copy of this file
     would duplicate the ~200 lines of page-local CSS below and the two copies
     would drift — the very failure a single manual source exists to prevent.
     Everything that is NOT a token is shared markup and CSS. -->
<html lang='{{LANG}}'>

<head>
    <meta charset="UTF-8">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="keywords" content="{{KEYWORDS}}">
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">

    <!-- Same stylesheet as the emulator, so the manual shares the exact
       DEC 1960s palette, photo backdrop, typography and scrollbar theming. -->
    <link rel="stylesheet" href="css/pdp11.css" type="text/css" charset="utf-8" media="all" />
    <link rel="stylesheet" href="css/landing.css" type="text/css" charset="utf-8" media="all" />

    <!-- Manual-page-only rules. Identical to the main page (index.html):
       the base pdp11.css already supplies the body photo backdrop, fonts and
       the .app-layout chrome; here we only adapt the content slab and reuse
       the main-page hero / call-to-action blocks. -->
    <style>
        /* Manual-page backdrop: same machine-room photo override as the
           main page. Only this page is affected; the emulator keeps its
           original backdrop. Paths are relative to manual.html at the repo
           root. */
        body {
            background-image:
                linear-gradient(rgba(24, 21, 17, 0.82), rgba(24, 21, 17, 0.82)),
                url("assets/images/pdp11-machine-room.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Content slab — mirrors the emulator's Info page (dark translucent card
           over the machine-room photo, block layout, readable column width). */
        .landing-page {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
            color: #e0d8c8;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px 24px 32px 24px;
            background: rgba(28, 25, 21, 0.82);
        }

        .landing-page h1,
        .landing-page h2,
        .landing-page h3,
        .landing-page h4 {
            color: #f0e6c8;
        }

        .landing-page a {
            color: #c8a860;
        }

        .landing-page a:hover {
            color: #e8d080;
        }

        .landing-page code {
            color: #d4c4a0;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 4px;
            border-radius: 2px;
        }

        .landing-page pre {
            color: #d0c8b8;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #4a453a;
            border-radius: 4px;
            padding: 8px 12px;
            overflow-x: auto;
        }

        .landing-page table {
            color: #e0d8c8;
            border-collapse: collapse;
        }

        .landing-page table thead {
            color: #f0e6c8;
        }

        .landing-page table td,
        .landing-page table th {
            padding: 5px 10px;
            border-bottom: 1px solid #3a3528;
            text-align: left;
            vertical-align: top;
        }

        .landing-page blockquote {
            margin: 12px 0;
            padding: 6px 14px;
            border-left: 3px solid #c8a860;
            border-radius: 0 4px 4px 0;
            background: rgba(0, 0, 0, 0.2);
            color: #d4c4a0;
        }

        .landing-page hr {
            border: 0;
            border-top: 1px solid #4a453a;
            margin: 26px 0;
        }

        .landing-page b,
        .landing-page strong {
            color: inherit;
        }

        /* Hero block */
        .hero {
            text-align: center;
        }

        .hero img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid #4a453a;
        }

        .hero .tagline {
            color: #c8b890;
            font-style: italic;
            font-size: 15px;
            margin: 10px 0 4px 0;
        }

        /* Zero-friction promise: the whole point is instant immersion. */
        .hero .zero-setup {
            color: #c8a860;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 0.5px;
            margin: 8px 0 0 0;
        }


        /* Small feature badges in the feature table (reuses .disk/.system) */
        .landing-page td.disk {
            white-space: nowrap;
        }

        /* Manual page illustrations: inline screenshots and their captions. */
        .landing-page .shot {
            max-width: 100%;
            height: auto;
            border: 1px solid #4a453a;
            border-radius: 4px;
            /* Centred like the caption below it: a portrait photograph (the
               DVK-2, the VTA-2000) is narrower than the column, and with the
               image flush left and its caption centred the block read as two
               misaligned halves. The manual is regenerated from this template,
               so one edit covers both the manual and every devlog post. */
            display: block;
            margin: 14px auto 2px auto;
        }

        .landing-page .shot-caption {
            color: #c8b890;
            font-size: 12px;
            font-style: italic;
            text-align: center;
            margin: 2px 0 14px 0;
        }

        /* A row of frames that belong together: the historical photograph and
           the emulator's own rendering of the same machine, shown in sequence.
           Equal column widths and top alignment — NOT object-fit: a cut-out
           machine and a machine inside its cabinet are crops of different
           scope, and cropping them to a shared ratio would silently cut the
           cabinet away. Frames keep their own proportions and are seen whole.
           Each frame carries its own caption, so a reader can tell the
           photograph from the rendering without counting places. */
        .landing-page .pair,
        .landing-page .row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-start;
            justify-content: center;
            margin: 16px 0 4px 0;
        }

        .landing-page .pair > figure,
        .landing-page .row > figure {
            /* A pair splits the column in two; a longer chain wraps on its own,
               so four frames become two rows of two rather than four unreadable
               slivers. */
            flex: 1 1 180px;
            max-width: 46%;
            margin: 0;
        }

        .landing-page .pair > figure .shot,
        .landing-page .row > figure .shot {
            /* Override the centred standalone rule: inside a group a frame fills
               its own column. */
            width: 100%;
            margin: 0;
        }

        .landing-page .pair > figure .shot-caption,
        .landing-page .row > figure .shot-caption {
            text-align: center;
            margin: 4px 0 0 0;
        }

        @media (max-width: 700px) {
            .landing-page .pair > figure,
            .landing-page .row > figure {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }

        /* Illustration viewer (the script is at the end of the document).

           A page is static, so this is plain CSS rather than a component. The
           picture is shown whole — max-width and max-height together, never a
           crop — and its caption sits underneath, because a photograph studied
           at full size is useless if you lose which frame you are looking at. */
        .landing-page .shot-openable {
            cursor: zoom-in;
        }

        .shot-viewer {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(12, 10, 8, 0.94);
            padding: 32px 16px;
        }

        .shot-viewer[hidden] {
            display: none;
        }

        .shot-viewer figure {
            margin: 0;
            max-width: 96vw;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .shot-viewer img {
            /* Both limits, so a tall frame and a wide frame are each shown in
               full; the picture is never cropped to fit. */
            max-width: 96vw;
            max-height: 80vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border: 1px solid #4a453a;
            border-radius: 4px;
        }

        .shot-viewer .shot-caption {
            color: #c8b890;
            font-size: 13px;
            font-style: italic;
            text-align: center;
            max-width: 80ch;
            margin: 0;
        }

        /* "3 / 4" beside the caption: which frame of a chain this is. */
        .shot-viewer .shot-caption[data-step]:not([data-step=""])::after {
            content: attr(data-step);
            color: #8a7f6a;
            font-style: normal;
        }

        .shot-viewer-close,
        .shot-viewer-nav {
            position: fixed;
            background: rgba(28, 25, 20, 0.9);
            color: #e8dcc0;
            border: 1px solid #4a453a;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1;
            font-family: inherit;
        }

        .shot-viewer-close {
            top: 12px;
            right: 16px;
            font-size: 26px;
            padding: 4px 12px 6px 12px;
        }

        .shot-viewer-nav {
            top: 50%;
            transform: translateY(-50%);
            font-size: 30px;
            padding: 10px 14px 12px 14px;
        }

        .shot-viewer-prev { left: 16px; }
        .shot-viewer-next { right: 16px; }

        .shot-viewer-close:hover,
        .shot-viewer-nav:hover {
            border-color: #c8a860;
            color: #f5ecd8;
        }

        .shot-viewer-nav[hidden] {
            display: none;
        }

        /* The page behind must not scroll while the viewer is up. */
        body.shot-viewer-open {
            overflow: hidden;
        }

        /* Floating-button thumbnails inside the controls table. */
        .landing-page .control-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            text-align: center;
        }

        .landing-page .control-btn {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border: 1px solid #4a453a;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.25);
        }

        .landing-page .control-name {
            color: #f0e6c8;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Config-tab illustrations: each screenshot beside its description. */
        .landing-page .config-item {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            margin: 18px 0;
        }

        .landing-page .config-item-img {
            flex: 0 0 46%;
            max-width: 46%;
            height: auto;
            border: 1px solid #4a453a;
            border-radius: 4px;
        }

        .landing-page .config-item-text {
            flex: 1 1 auto;
        }

        .landing-page .config-item-text h3 {
            margin-top: 0;
        }

        .landing-page .config-item-text p {
            margin: 6px 0 0 0;
        }

        .landing-page .config-item-text ul {
            margin: 6px 0 0 0;
            padding-left: 18px;
        }

        .landing-page .config-item-text li {
            margin: 3px 0;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <div class="landing-page">

            <div class="hero">
                <h1>{{HERO_TITLE}}</h1>
                <p class="tagline">{{HERO_TAGLINE}}</p>
                <p class="zero-setup">{{HERO_NOTE}}</p>
                <div class="panel-actions-landing">
                    <a class="btn-primary" href="pdp11.html">{{BTN_LAUNCH}}</a>
                    <a class="btn-secondary" href="{{HOME_HREF}}">{{BTN_HOME}}</a>
                    <a class="btn-secondary" href="{{ALT_HREF}}">{{ALT_LABEL}}</a>
                </div>
            </div>

            <hr>
