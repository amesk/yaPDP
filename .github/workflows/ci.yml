# ---------------------------------------------------------------------------
# yaPDP CI — unit tests + the e2e suites on every push/PR.
#
# Two jobs:
#   unit  — the modular npm test suite (every tests/*.test.js) on Node 20 and
#           22, driven by tools/run-tests.js (npm test).
#   e2e   — every e2e suite, run by tools/validate.js: ONE shared static server
#           on :1170 and the suites in sequence. This is the SAME file the local
#           `npm run validate` runs, so CI and local can never drift — the suite
#           list lives in the SUITES array of tools/validate.js, not here.
#
# E2E failure artifacts (screenshots + console tails) are uploaded so a red
# run can be diagnosed without re-running locally.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [master, 'jarvis/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e:
    name: E2E (every suite, via tools/validate.js)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache puppeteer Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # One shared server on :1170 plus the suites in sequence — the SAME file
      # the local `npm run validate` runs (the suite list lives in its SUITES
      # array, so CI and local cannot drift).
      - name: Run every e2e suite (one server, sequential)
        run: node tools/validate.js

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: tests/artifacts/
          retention-days: 7
