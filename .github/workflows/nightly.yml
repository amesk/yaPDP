# ---------------------------------------------------------------------------
# Nightly screenshot drift check — DISABLED (kept as a ready-to-use template).
# ---------------------------------------------------------------------------
# Regenerates the manual's screenshots (tools/screenshots-manual.js, ~4 min)
# and, if the CSS/layout changed the pixels, opens a PR with the new images.
# This catches regressions like "style tweaked, screenshots not regenerated"
# (e.g. the LP11 button-shadow fix) without anyone noticing.
#
# Why disabled: it pushes commits from CI, which needs the workflow
# permission "contents: write" and a moment of trust in auto-generated PRs.
# Enable when comfortable:
#   1. Uncomment everything below.
#   2. Repo Settings -> Actions -> General -> Workflow permissions ->
#      "Read and write permissions".
# ---------------------------------------------------------------------------

