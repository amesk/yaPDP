# ---------------------------------------------------------------------------
# yaPDP release pipeline — build all desktop installer artifacts for a
# releases/v* tag and publish them as a GitHub Draft release.
#
# Triggered two ways:
#   * push of a releases/v* tag   (automatic — the classic release flow)
#   * manual workflow_dispatch with an explicit tag/ref to build
#
# After the matrix builds (Linux + Windows x Minimal + Full), one aggregator
# job collects the bundles, adds the CHANGELOG.md / RELEASE_NOTES.md assets,
# computes a yaPDP-$TAG-SHA256SUMS.txt file, and creates/updates a DRAFT
# release (never publishes). Publish the draft by hand after the smoke test.
#
# The workflow lives in the repo where it runs: rehearsed end-to-end on
# yapdp-bot/yaPDP (git pages + artifact upload/check), then promoted verbatim
# to amesk/yaPDP via a normal PR once the rehearsal is clean. Real releases
# are only tagged on amesk/yaPDP after full rehearsal.
# ---------------------------------------------------------------------------
name: release

on:
  push:
    tags: ['releases/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git ref/tag to build (e.g. releases/v0.2.0-rc1, master)'
        required: true
        default: 'releases/v0.2.0-rc1'
        type: string

permissions:
  contents: write          # create the draft release and upload assets

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false    # do not abort assembly mid-release

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        variant: [minimal, full]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build deps (Tauri v2 system libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri v2 native build/runtime deps (see README.md build prereqs) +
          # libfuse2/patchelf for AppImage bundling. Without the gtk/glib/webkit
          # dev packages the rehearsal build fails compiling glib-sys/gtk-sys.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2 patchelf

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # tauri-build.js runs `cargo tauri build`; the cargo-tauri CLI is a
      # separate binary that is NOT installed by the rust toolchain. The
      # rehearsal run failed with "error: no such command: tauri" for this
      # reason. Install tauri-cli v2 (matches README build prereqs).
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend deps
        run: npm ci

      - name: Build ${{ matrix.variant }} bundle
        run: npm run desktop:${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.variant }}
          path: src-tauri/target/release/bundle/

  assemble:
    name: Assemble draft release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: bundles/
          merge-multiple: true

      - name: Resolve tag name
        id: tag
        run: |
          # The release tag: an explicit manual tag wins, else the pushed tag.
          REF="${{ inputs.tag || github.ref_name }}"
          TAG="${REF##refs/tags/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Version for the checksum filename: strip the "releases/" prefix so
          # the file is yaPDP-0.2.0-SHA256SUMS.txt, not yaPDP-releases/v0.2.0-...
          VERSION="${TAG##releases/}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved release tag: $TAG (version $VERSION)"

      # CHANGELOG + RELEASE_NOTES as release assets; checksums over every
      # installer artifact. Named yaPDP-<version>-SHA256SUMS.txt (release canon).
      - name: Stage docs and checksums
        run: |
          mkdir -p staged
          cp CHANGELOG.md RELEASE_NOTES.md staged/
          # sha256sum is available on the ubuntu runner; name per convention.
          SUMFILE="yaPDP-$VERSION-SHA256SUMS.txt"
          # Only files (skip directories) under bundles/, relative names.
          find bundles -type f -print0 | xargs -0 sha256sum | sed "s|^bundles/||" > "staged/$SUMFILE"
          cat "staged/$SUMFILE"

      - name: Create / update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent over the same tag (re-run): create fails if the draft
          # already exists, which is fine — subsequent uploads use --clobber.
          gh release create "$TAG" --draft \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md 2>/dev/null || true
          # Docs + checksums first, then only the installer files. Do NOT
          # upload bundles/**/* wildcard: the artifacts directory also holds
          # Tauri bundle intermediates (.AppDir, .pkg dirs, 'empty'), and gh
          # fails on "is a directory". Upload just the release artifacts.
          gh release upload "$TAG" staged/* --clobber
          gh release upload "$TAG" $(find bundles -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \)) --clobber
          echo "Draft release $TAG staged. Review, smoke-test, then publish."
