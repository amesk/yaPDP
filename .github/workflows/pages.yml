# ---------------------------------------------------------------------------
# yaPDP site deploy — build the React landing and publish the whole site
# (landing SPA as index.html + the emulator and its media at the repo root)
# to GitHub Pages from Actions.
#
# The public demo follows the release cadence: it publishes when a
# releases/v* tag is pushed (i.e. what we validated and shipped), not on
# every master commit. Manual dispatch (Actions -> Run workflow) accepts
# any branch — the rollback path: a checkout without landing/ publishes
# the classic static site.
#
# The deployed site is the repository root with landing/dist overlaid, so
# the emulator stays same-origin: the SPA links /pdp11.html directly and
# every guest image keeps working.
# ---------------------------------------------------------------------------
name: pages

on:
  push:
    tags: ['releases/v*']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch/commit to publish (default: master). A branch without landing/ falls back to the classic static site — one-click rollback.'
        required: false
        default: 'master'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch || 'master' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Build the landing SPA (skipped when landing/ is absent — rollback path)
        working-directory: landing
        if: hashFiles('landing/package.json') != ''
        run: |
          npm ci
          npm run build

      - name: Assemble the site (repo root + landing/dist overlay)
        run: |
          mkdir -p site
          rsync -a --exclude .git --exclude .github --exclude .wireit \
            --exclude landing --exclude node_modules --exclude tests \
            --exclude docs --exclude tools --exclude src-tauri \
            --exclude desktop --exclude macro-asm --exclude .roo \
            --exclude dist-linux --exclude video --exclude "*.log" \
            --exclude package.json --exclude package-lock.json \
            --exclude CHANGELOG.md --exclude LICENSE --exclude README.md \
            ./ site/
          if [ -d landing/dist ]; then cp -r landing/dist/* site/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
