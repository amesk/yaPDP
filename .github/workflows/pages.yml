# ---------------------------------------------------------------------------
# yaPDP site deploy — build the React landing and publish the whole site
# (landing SPA as index.html + the emulator and its media at the repo root)
# to GitHub Pages from Actions.
#
# The public demo follows the release cadence: it publishes when a
# releases/v* tag is pushed (i.e. what we validated and shipped), not on
# every master commit. Manual dispatch (Actions -> Run workflow) accepts
# any branch — the rollback path: a checkout without landing/ publishes
# the classic static site.
#
# The deployed site is the repository root with landing/dist overlaid, so
# the emulator stays same-origin: the SPA links /pdp11.html directly and
# every guest image keeps working.
# ---------------------------------------------------------------------------
name: pages

on:
  push:
    tags: ['releases/v*']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch/commit to publish (default: master). A branch without landing/ falls back to the classic static site — one-click rollback.'
        required: false
        default: 'master'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Manual dispatch: publish the requested branch (default master).
          # Tag push (releases/v*): publish the tagged commit itself — never
          # the default branch, which may have moved past the release.
          ref: ${{ github.event.inputs.branch || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Key on the root lockfile: it exists in every checkout, including
          # the static-site rollback path where landing/ is absent (the npm
          # cache is content-addressed, so landing packages still hit).
          cache-dependency-path: package-lock.json

      # Restored before npm ci so the Chromium download behind the `puppeteer`
      # postinstall is skipped on a cache hit — the manual PDFs need a browser.
      - name: Cache puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The manual pages, the devlog pages and the manual PDFs are generated,
      # not committed (see .gitignore): the deployed site is assembled from
      # sources, so this step is what puts manual.html / manual_ru.html / the
      # PDFs at the site root before site-preview.js copies the tree.
      #
      # The guard is a runtime check for the target itself, not a file: the
      # rollback path publishes an older checkout that may predate both the
      # `docs` script and the generator, and the committed pages of that
      # checkout are still the right thing to publish.
      - name: Build the documentation (manual pages, PDFs, devlog)
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts.docs ? 0 : 1)"; then
            npm ci
            PUPPETEER_NO_SANDBOX=1 npm run docs
          else
            echo "::notice::no docs target in this checkout — publishing its committed pages"
          fi

      - name: Build the landing SPA (skipped when landing/ is absent — rollback path)
        working-directory: landing
        if: hashFiles('landing/package.json') != ''
        run: |
          npm ci
          npm run build

      - name: Assemble the site (repo root + landing/dist overlay)
        run: node tools/site-preview.js site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
