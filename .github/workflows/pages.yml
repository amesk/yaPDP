# ---------------------------------------------------------------------------
# GitHub Pages deployment — DISABLED (kept as a ready-to-use template).
# ---------------------------------------------------------------------------
# Alexei publishes the site manually through the GitHub web UI
# (Settings -> Pages -> "Deploy from a branch"), so this workflow is
# intentionally left commented out to avoid double-publishing or surprises.
#
# To enable automated deployment:
#   1. Uncomment everything below.
#   2. In repo Settings -> Pages, switch Source to "GitHub Actions".
#   3. Optionally publish a lighter demo build (tools/build-desktop.js
#      --variant minimal stages just the tapes + RT-11 images) so visitors
#      are not asked to download the full 83 MB media/ set.
#
# Note: GitHub Pages does not reliably honour HTTP Range requests, so the
# emulator falls back to fetching whole .zst images. That is fine for
# RT-11/BASIC (a few hundred KB), slow for RSTS/BSD (5-20 MB).
# ---------------------------------------------------------------------------

